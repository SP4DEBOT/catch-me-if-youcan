<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Roast Me If You Can</title>

    <link rel="stylesheet"
          href="./css/style.css">

</head>

<body>
    <img src="./assets/bg.gif" id="bg-gif" alt="Background">
    <header class="game-header" id="header">

        <h1>Lets start
        </h1>

        <div class="stats">

            <div class="card">
                <h3>Attempts</h3>
                <p id="attempts">0</p>
            </div>

            <div class="card">
                <h3>Escapes</h3>
                <p id="escapes">0</p>
            </div>

            <div class="card">
                <h3>Time</h3>
                <p id="timer">00:00</p>
            </div>


        </div>

        <div class="roast-box">

            <p id="roast">
                Catch me... if you can 😏
            </p>

        </div>

    </header>

    <button id="catch-btn">

        Catch Me

    </button>
    <script src="./js/roasts.js"></script>
    <script src="./js/app.js"></script>

</body>

</html>
